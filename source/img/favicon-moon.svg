<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#363a68"/>
      <stop offset="0.5" stop-color="#20233f"/>
      <stop offset="1" stop-color="#0e0f22"/>
    </linearGradient>
    <linearGradient id="moon" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fffaea"/>
      <stop offset="0.5" stop-color="#f9e7b6"/>
      <stop offset="1" stop-color="#e2bd6e"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="310" cy="258" r="140" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 弯月 -->
  <g transform="rotate(-16 230 258)">
    <circle cx="230" cy="258" r="134" fill="url(#moon)" mask="url(#cut)"/>
  </g>

  <!-- 飞鸟：展翅剪影，翼尖上翘 -->
  <g transform="translate(340,188) scale(1.22)">
    <path fill="#fffaea"
          d="M -62,18
             C -46,-8 -26,-22 -6,-6
             C -2,-16 2,-16 6,-6
             C 26,-22 46,-8 62,18
             C 42,2 22,6 8,16
             C 2,20 -2,20 -8,16
             C -22,6 -42,2 -62,18 Z"/>
  </g>
</svg>
